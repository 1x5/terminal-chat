[tox]
envlist = py38, py39, py310, py311
isolated_build = True

[testenv]
deps =
    -r requirements.txt
    -r requirements-test.txt
commands =
    pytest --cov=src --cov-report=html --cov-report=term {posargs:tests}

[testenv:lint]
deps =
    flake8
    black
    isort
commands =
    flake8 src tests
    black --check src tests
    isort --check-only src tests

[flake8]
max-line-length = 100
exclude = .tox,*.egg,build,data
ignore = E203, W503

[isort]
profile = black
multi_line_output = 3 